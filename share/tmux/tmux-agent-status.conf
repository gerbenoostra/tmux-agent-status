# tmux-agent-status - agent lifecycle events as one glyph on the tmux window entry.
#
# Source this from ~/.tmux.conf:
#
#     source-file ~/.tmux/tmux-agent-status.conf
#
# It turns `focus-events` on and sets three hooks, and nothing else. Everything
# below the line is a comment you paste yourself: this tool never rewrites a
# format string it does not own, because a spliced copy written to a window-local
# option freezes that window's format forever.

# Focusing a pane acknowledges it: its non-sticky states (waiting, error, done)
# are dropped and the window glyph is recomputed from what the other panes still
# hold. `working` survives, so glancing at an agent that is still running does
# not blank it. Only the pane that gained focus is touched - a sibling pane that
# is merely visible has not been read.
#
# `focus-events` makes tmux ask its terminal to report when it gains or loses
# focus, which is what lets `pane-focus-in` fire when you switch back to the
# terminal from another tab, desktop or monitor. It is a global option with
# effects beyond this tool: a tmux nested in a pane starts tracking its client's
# focus, and an editor such as vim or neovim starts firing FocusGained and
# FocusLost, which drive autoread and autosave. A terminal that does not support
# focus reporting ignores the request. To decline it, delete the line below; the
# only thing lost is clearing on returning to the terminal, because the other two
# hooks still cover switching windows and panes inside tmux.
#
# Three hooks, all calling the same pane-scoped command:
#
#   pane-focus-in            sees terminal focus, and needs `focus-events on`.
#                            It also fires when a client attaches, for the pane
#                            it lands on, whatever `focus-events` says.
#   session-window-changed   the fallback for `focus-events off`: switching
#   window-pane-changed      windows, and switching panes inside one.
#
# With focus events on they overlap and the repeats change nothing: same pane,
# same result.
#
# The pane is passed explicitly: run-shell expands #{...} in the command but
# does not put TMUX_PANE in the environment. The index leaves any hook of your
# own at the same name in place, and -b keeps a window switch from waiting on a
# process to start. Check all four landed with:
#
#     tmux show-options -g focus-events                           # on
#     tmux show-hooks -g | grep tmux-agent-status                 # session-window-changed
#     tmux show-hooks -gw | grep tmux-agent-status                # pane-focus-in, window-pane-changed
#
set -g focus-events on

set-hook -g 'pane-focus-in[50]' 'run-shell -b "tmux-agent-status clear-pane #{pane_id}"'
set-hook -g 'session-window-changed[50]' 'run-shell -b "tmux-agent-status clear-pane #{pane_id}"'
set-hook -g 'window-pane-changed[50]' 'run-shell -b "tmux-agent-status clear-pane #{pane_id}"'

# ---------------------------------------------------------------------------
# 1. The format term. Paste it into BOTH window-status-format and
#    window-status-current-format, after the name segment (outside any
#    truncation you have) and before the window flags:
#
#        #{?@agent_status, #{@agent_status},}
#
#    For example:
#
#        set -g window-status-format '#I:#{=/25/…:#{window_name}}#{?@agent_status, #{@agent_status},}#{?window_flags,#{window_flags}, }'
#
#    The name segment stays whatever you already had. A window with no agent
#    pane has no @agent_status, so the term renders nothing and the entry looks
#    exactly as it did before you installed this.
#
#    The window_flags is tmux's own indicator string ("*" current, "-" last window,
#    "!" bell, "#" activity, "~" silenced, "Z" zoomed, "M" marked). The trailing
#    "-" marks whatever window prefix-l jumps back to.
#
# 2. Optional, off by default: recolour `error`, the one state the bell cannot
#    express. Paste it in front of the name segment, in both formats.
#
#        #{?#{==:#{@agent_status},❗},#[fg=colour160#,bold#,nodim],}
#
#    For example:
#
#        set -g window-status-format '#I:#{?#{==:#{@agent_status},❗},#[fg=colour160#,bold#,nodim],}#{=/25/…:#{window_name}}#{?@agent_status, #{@agent_status},}#{?window_flags,#{window_flags}, }'
#
#    The style runs to the end of the entry, so the name and flags turn red, and
#    on that window it replaces the window-status-bell-style colour.
#    It compares the glyph, because @agent_status holds what is rendered.
#    Inside #{...}, `#,` escapes a comma so it is not read as a separator.
#
# 3. Optional: let a bell leave tmux even when the agent runs in the current
#    window of its session. These are tmux's defaults; paste them only if your
#    configuration changed them:
#
#        setw -g monitor-bell on
#        set -g bell-action any
#        set -g visual-bell off
#
#    `any` matters when that tmux client is behind another terminal tab,
#    desktop or monitor. It also forwards every other bell from the current
#    window, including shell and editor beeps. The terminal decides whether the
#    forwarded BEL becomes a tab marker, an attention request or a sound.
#
