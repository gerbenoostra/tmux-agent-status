[package]
name = "tmux-agent-status"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Agent lifecycle events as one glyph on the tmux window entry"
repository = "https://github.com/gerbenoostra/tmux-agent-status"
license = "MIT"
readme = "README.md"
exclude = ["tasks/"]
keywords = ["tmux", "agent", "status", "hook"]
categories = ["command-line-utilities"]

[dependencies]
pico-args = "0.5.0"
# `preserve_order`: a merge that reorders a user's keys is a diff they did not
# ask for, and this tool edits files it did not write.
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
    "preserve_order",
] }

[profile.release]
strip = true

[dev-dependencies]
libc = "0.2"
