[package]
name = "tmux-agent-status"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Agent lifecycle events as one glyph on the tmux window entry"
repository = "https://github.com/gerbenoostra/tmux-agent-status"
license = "MIT"
readme = "README.md"
keywords = ["tmux", "agent", "status", "hook"]
categories = ["command-line-utilities"]

[dependencies]
pico-args = "0.5.0"
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[profile.release]
strip = true

[dev-dependencies]
libc = "0.2"
