[package]
name = "tmux-agent-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent lifecycle events as one glyph on the tmux window entry"
repository = "https://github.com/gerbenoostra/tmux-agent-status"
license = "MIT"
readme = "README.md"
keywords = ["tmux", "agent", "status", "hook"]
categories = ["command-line-utilities"]

[dependencies]
# The agent list is genuinely a checkbox and a 300-character format string
# genuinely needs an editor. Only the `editor` feature: `password` and
# `zeroize` are for something this tool never asks for.
dialoguer = { version = "0.12.0", default-features = false, features = ["editor"] }
# `eq-separator`: pico-args ships with no features at all, so `--key=value` is
# not understood without this. `register --agents=codex,cursor` is the
# documented spelling, and it is the only unambiguous one for a flag whose
# value is optional.
pico-args = { version = "0.5.0", features = ["eq-separator"] }
# `preserve_order`: a merge that reorders a user's keys is a diff they did not
# ask for, and this tool edits files it did not write.
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
    "preserve_order",
] }

[profile.release]
strip = true

[dev-dependencies]
libc = "0.2"
tempfile = "3.27.0"
